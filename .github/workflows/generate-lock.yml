name: Generate lockfile
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --global npm@9.2.0
      - run: npm install --package-lock-only --ignore-scripts
      - run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'package-lock.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          const strip = (value) => {
            if (Array.isArray(value)) return value.map(strip);
            if (value && typeof value === 'object') {
              delete value.license;
              for (const key of Object.keys(value)) value[key] = strip(value[key]);
            }
            return value;
          };
          fs.writeFileSync(file, JSON.stringify(strip(data), null, 2) + String.fromCharCode(10));
          NODE
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git diff --cached --quiet || git commit -m "Preserve lockfile final newline"
          git push origin HEAD:main
